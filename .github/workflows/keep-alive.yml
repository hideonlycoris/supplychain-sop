# Supabase 免费项目保活
#
# Supabase 免费版规则：项目闲置满 1 周会自动暂停，暂停后 DNS 记录被撤掉，
# 应用会报 "Name or service not known"。这里定期发一次真实 SQL 查询，
# 让项目始终保持活跃。
#
# 频率取每 3 天而非每周：7 天阈值下按周跑是零余量，只要失败一次就会被暂停。
# 想改成每周：把下面 */3 改成 * 即可。
name: Supabase 保活

on:
  schedule:
    - cron: '23 1 */3 * *'   # 每逢 1/4/7... 号 01:23 UTC = 北京时间 09:23
  workflow_dispatch:          # 支持在 Actions 页手动触发

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 发一次真实查询，刷新项目活跃度
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          set -euo pipefail

          if [ -z "${SUPABASE_URL:-}" ] || [ -z "${SUPABASE_KEY:-}" ]; then
            echo "::error::仓库缺少 SUPABASE_URL / SUPABASE_KEY 这两个 Actions secrets"
            exit 1
          fi

          # 必须查一张真实存在的表，才会真正执行 SQL；只打 /rest/v1/ 根路径
          # 走的是缓存的 OpenAPI 描述，可能不触库，算不上活跃。
          URL="${SUPABASE_URL}/rest/v1/sku_data?select=sku_name&limit=1"
          echo "GET ${URL}"

          code=$(curl -sS -o /tmp/resp.txt -w '%{http_code}' --max-time 30 \
            -H "apikey: ${SUPABASE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_KEY}" \
            -H "Accept: application/json" \
            "${URL}" || echo 000)

          echo "HTTP ${code}"
          cat /tmp/resp.txt 2>/dev/null || true
          echo

          if [ "${code}" = "200" ]; then
            echo "✅ 数据库连通，活跃度已刷新"
          else
            echo "::error::保活请求失败 (HTTP ${code})。项目可能又被暂停了，或 key/表名有变。到 https://supabase.com/dashboard 检查项目状态。"
            exit 1
          fi
